name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails CLI
        shell: bash
        run: |
          WAILS_VER=$(grep 'github.com/wailsapp/wails/v2' go.mod | awk '{print $2}')
          go install github.com/wailsapp/wails/v2/cmd/wails@$WAILS_VER
      - name: CI (frontend dist → bindings → go test)
        run: pwsh -NoProfile -File scripts/make.ps1 ci
