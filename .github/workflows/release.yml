name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（如 0.2.0），留空则使用当前 git 标签或分支名"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
      - name: Compute version
        id: version
        shell: bash
        run: |
          VER="${{ inputs.version }}"
          if [ -z "$VER" ]; then
            VER="${GITHUB_REF_NAME#v}"
          fi
          echo "value=$VER" >> "$GITHUB_OUTPUT"
      - name: Sync version into mygo.json
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const p = 'mygo.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.version = process.argv[1];
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            console.log('version -> ' + process.argv[1]);
          " "${{ steps.version.outputs.value }}"
      - name: Build (MyGO)
        run: go tool mygo build
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows-amd64/Videopress.exe
            dist/windows-amd64/Videopress Setup ${{ steps.version.outputs.value }} amd64.exe
          generate_release_notes: true
      - name: Upload build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: videopress
          path: dist/windows-amd64/
